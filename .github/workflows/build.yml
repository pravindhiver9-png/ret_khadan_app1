
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Check Project Files
        run: |
          echo "Project directory:"
          ls -la

          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml missing"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart missing"
            exit 1
          }

      - name: Generate Android Platform
        run: |
          flutter create --platforms=android .

      - name: Verify Android Platform
        run: |
          ls -la android
          ls -la android/app

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
