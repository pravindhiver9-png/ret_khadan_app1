
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter version
      - name: Check Flutter Version
        run: flutter --version

      # Check project files
      - name: Check Project Files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      # Generate Android files if missing
      - name: Generate Android Platform
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      # Verify Android files
      - name: Verify Android Platform
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/gradlew

      # Dependencies
      - name: Get dependencies
        run: flutter pub get

      # Analyze
      - name: Analyze
        run: flutter analyze

      # Build APK
      - name: Build APK
        run: flutter build apk --release

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
