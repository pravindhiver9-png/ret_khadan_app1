
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Show Android Gradle Files
        run: |
          echo "Current directory:"
          pwd

          echo "Android folder:"
          ls -la android

          echo "Android app folder:"
          ls -la android/app

          echo "Searching Gradle files:"
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Verify Gradle Configuration
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "Found: android/app/build.gradle.kts"
          elif [ -f android/app/build.gradle ]; then
            echo "Found: android/app/build.gradle"
          else
            echo "Gradle file not found in app folder."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
