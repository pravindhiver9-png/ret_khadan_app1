
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Flutter version
      - name: Check Flutter Version
        run: flutter --version

      # 4. Check project root
      - name: Check Project
        run: |
          pwd
          ls -la
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found"
            exit 1
          }

      # 5. Repair Android platform files
      - name: Generate Android Platform
        run: |
          if [ ! -f android/app/build.gradle ]; then
            echo "Android Gradle file missing."
            echo "Generating Android platform files..."
            flutter create --platforms=android .
          else
            echo "Android Gradle file already exists."
          fi

      # 6. Verify Gradle files
      - name: Verify Android Files
        run: |
          echo "Android files:"
          find android -maxdepth 4 -type f | sort
          test -f android/app/build.gradle || {
            echo "ERROR: android/app/build.gradle still missing"
            exit 1
          }

      # 7. Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # 8. Analyze
      - name: Analyze
        run: flutter analyze

      # 9. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
