
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Check Flutter version
      - name: Check Flutter Version
        run: flutter --version

      # 4. Get existing dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5. Add new Material UI package
      - name: Add Material UI
        run: flutter pub add material_ui

      # 6. Migrate old Material imports
      - name: Migrate Material UI
        run: dart fix --apply --code=migrate_design_widgets

      # 7. Analyze project
      - name: Analyze
        run: flutter analyze

      # 8. Build Android APK
      - name: Build APK
        run: flutter build apk --release

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
