
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Flutter version
      - name: Check Flutter Version
        run: flutter --version

      # 4. Check Android Gradle files
      - name: Check Android Files
        run: |
          echo "Checking Gradle files..."

          if [ -f android/app/build.gradle.kts ]; then
            echo "Kotlin Gradle file found."
          elif [ -f android/app/build.gradle ]; then
            echo "Groovy Gradle file found."
          else
            echo "ERROR: Android Gradle file missing."
            exit 1
          fi

      # 5. Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # 6. Analyze
      - name: Analyze
        run: flutter analyze

      # 7. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
