name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Check Flutter and project files
        run: |
          flutter --version
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f test/widget_test.dart

      - name: Create Android platform if missing
        run: |
          if [ ! -f android/gradlew ] || { [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; }; then
            flutter create --platforms=android .
          fi

      - name: Verify Android platform
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
