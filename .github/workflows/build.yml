
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Check Flutter version
      - name: Check Flutter Version
        run: flutter --version

      # 4. Check project files
      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Android folder:"
          ls -la android || true
          echo "Android app folder:"
          ls -la android/app || true
          echo "Gradle files:"
          find android -maxdepth 4 -type f || true

      # 5. Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # 6. Add Material UI
      - name: Add Material UI
        run: flutter pub add material_ui

      # 7. Migrate Material UI
      - name: Migrate Material UI
        run: dart fix --apply --code=migrate_design_widgets

      # 8. Analyze project
      - name: Analyze
        run: flutter analyze

      # 9. Build Android APK
      - name: Build APK
        run: flutter build apk --release

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ret-khadan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
