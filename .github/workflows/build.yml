name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android project banao
        run: |
          flutter create --project-name ret_khadan --org com.retkhadan --platforms=android /tmp/gen
          cp -r /tmp/gen/android ./android
          D=android/app/src/main/kotlin/com/retkhadan/ret_khadan
          mkdir -p $D
          cp native/MainActivity.kt $D/MainActivity.kt
          sed -i 's/android:label="[^"]*"/android:label="रेत खदान"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: RetKhadan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
