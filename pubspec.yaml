name: ret_khadan_management
description: Offline Ret Khadan Management App with MPIN, Hindi/English, Daily Auto Backup, PDF & Excel.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  share_plus: ^10.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
