name: ret_khadan_app1
description: Ret Khadan Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.12.0
  excel: ^4.0.3
  share_plus: ^9.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
